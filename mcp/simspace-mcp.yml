note: >-
  SimSpace serves a live, OAuth-protected remote MCP endpoint from its own corporate
  host. It is discoverable the correct way: /.well-known/oauth-protected-resource
  (RFC 9728) names the resource, /.well-known/oauth-authorization-server (RFC 8414)
  names the authorization server, and an anonymous POST of tools/list returns
  HTTP 401 with a well-formed
  `WWW-Authenticate: Bearer realm="https://simspace.com", resource_metadata="..."`
  challenge. IMPORTANT SCOPE CAVEAT, recorded so nobody over-reads this: the endpoint
  is the WordPress MCP adapter running on the simspace.com marketing site (the
  wp-json/mcp namespace, alongside a wp-abilities/v1 namespace), NOT the SimSpace
  cyber range platform API at portal.simspace.com/api/v1. It exposes the corporate
  website's WordPress abilities to an agent, not range or simulation operations. The
  tool list could not be enumerated because tools/list is auth-gated; no tool names
  are recorded here rather than guessed.
