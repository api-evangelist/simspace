aid: simspace
name: SimSpace
description: 'SimSpace Corporation builds a realistic, high-fidelity cyber range and
  simulation platform used by security teams to train people, test technology, and
  now to train, validate and operationalize AI agents alongside human defenders. The
  product line spans the AI Proving Grounds, Range Workbench (visual and YAML-as-code
  range design and versioning), and Team Trainer, delivered through the SimSpace Portal
  Suite at portal.simspace.com with a European instance at portal-eu.simspace.com.
  SimSpace serves critical infrastructure, financial services, healthcare, insurance,
  higher education, US federal and military, state and local, and international government
  customers. The platform is described by the company as API-first, exposing programmatic
  access for custom integrations, automation and data extensibility; the platform REST
  API is served from portal.simspace.com/api/v1 but its reference documentation is
  published only inside the authenticated portal and the customer-only Freshdesk support
  site, so no public machine-readable contract is available. SimSpace is headquartered
  in Orlando, Florida.'
