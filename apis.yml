apis:
- aid: simspace-platform
  name: SimSpace Platform API
  description: 'The SimSpace Portal Suite platform API. SimSpace describes the cyber
    range platform as built API-first, giving partners and customers programmatic access
    for custom integrations, automation, advanced workflows and data extensibility.
    Published release notes reference specific API surfaces including an audit-log
    extraction endpoint and a bulk REST API service for auditing content shares. The
    API host answers on portal.simspace.com/api/v1 (HTTP 400 "invalid arguments" to
    an unparameterized anonymous request, confirming a live router), but the API reference
    is served only from the authenticated portal single-page application and the
    customer-only Freshdesk support site, so no public OpenAPI, GraphQL SDL or other
    machine-readable contract could be retrieved.'
